version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pcc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pcc"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pcc
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_CASE: ${OPENAI_MODEL_CASE:-gpt-4.1}
      OPENAI_MODEL_SUPERVISOR: ${OPENAI_MODEL_SUPERVISOR:-gpt-4.1}
      MAX_TURNS: ${MAX_TURNS:-20}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
